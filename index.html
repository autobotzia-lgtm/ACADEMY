<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoBotz.ai - Member Area</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Orbitron simulates Ethnocentric, Rajdhani simulates Bank Gothic -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'bot-cyan': '#00A7FF',
              'bot-purple': '#4902A6',
              'bot-pink': '#F77CFE',
              'bot-dark': '#0a0a12',
              'bot-panel': '#12121f',
            },
            fontFamily: {
              'ethno': ['Orbitron', 'sans-serif'],
              'bank': ['Rajdhani', 'sans-serif'],
            },
            boxShadow: {
              'neon-cyan': '0 0 10px #00A7FF, 0 0 20px #00A7FF',
              'neon-purple': '0 0 10px #4902A6, 0 0 20px #4902A6',
              'neon-pink': '0 0 10px #F77CFE, 0 0 20px #F77CFE',
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #050505;
        color: white;
        overflow-x: hidden;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a12; 
      }
      ::-webkit-scrollbar-thumb {
        background: #4902A6; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #F77CFE; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
